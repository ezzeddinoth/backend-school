image: golang:latest

stages:
  - test
  - build
  - publish
  - deploy


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG


test:
  stage: test
  script:
    - go fmt ./... 
    - go vet ./... 
    - go test ./... 


# Validate versioning guidelines
# E22003 - Wiki > Team DFI Definitionen, Regelungen, Checklisten > Regelungen > "Semantische Versionierung"
version-file-validation:
  stage: test
  artifacts:
    reports:
      junit: results.xml
  tags:
    - cPlusPlus # This is a runner at stadler. 
  rules:
    - if: '$CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"' # Checky only for merges to dev
      when: on_success
    - when: never
  before_script:
    - git clone --branch Package https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/stadlerrail/sigde/mofis/dfi/playground/dmr.git ci-cd-scripts
  script:
    - cmd /c ci-cd-scripts\\testVersion.bat


build-dev:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    BUILD_PATH: "${CI_PROJECT_NAME}/internal/build"
  script:
    - GOOS=windows GOARCH=amd64 go build -v -ldflags="-s -w -X '${BUILD_PATH}.gitCommit=${CI_COMMIT_SHORT_SHA}' -X '${BUILD_PATH}.date=${CI_COMMIT_TIMESTAMP}'" -o cmd/${CI_PROJECT_NAME}.exe cmd/main.go                                    
  artifacts:
    name: executable
    when: on_success
    expire_in: 2 hrs
    paths: 
      - './cmd/*.exe'


build-release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    BUILD_PATH: "${CI_PROJECT_NAME}/internal/build"
  script:
    - GOOS=windows GOARCH=amd64 go build -v -ldflags="-s -w -X '${BUILD_PATH}.gitVersion=${CI_COMMIT_TAG}' -X '${BUILD_PATH}.gitCommit=${CI_COMMIT_SHORT_SHA}' -X '${BUILD_PATH}.date=${CI_COMMIT_TIMESTAMP}'" -o cmd/${CI_PROJECT_NAME}.exe cmd/main.go                                    
  artifacts:
    name: executable
    when: on_success
    expire_in: 2 hrs
    paths: 
      - './cmd/*.exe'


prepare-package:
  stage: publish
  artifacts:
    name: executable
    when: on_success
    expire_in: 2 hrs
    paths: 
      - './install/*'
  tags:
  - stadler-dev-env
  only:
    - dev
  needs:
    - job: build-dev
      artifacts: true
  before_script:
    - git clone --branch Package https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/stadlerrail/sigde/mofis/dfi/playground/dmr.git ci-cd-scripts
  script:
    - powershell.exe -ExecutionPolicy Bypass -NoProfile -File .\\ci-cd-scripts\\deletePackage.ps1 -packageName "install"
    - $ProgressPreference = 'SilentlyContinue'
    - if(-not (Test-Path -Path "install")){mkdir install} # make sure that a install folder exist
    - copy cmd/*exe install/
    - copy VERSION install/
    - powershell.exe -ExecutionPolicy Bypass -NoProfile -File .\\ci-cd-scripts\\copyConfig.ps1 -projectFolder install/
    - tar.exe -a -c -f install.zip --strip-components=1 install/*
    - cmd /c ci-cd-scripts\\upload.bat
  variables:
    CI_ENVIRONMENT: "DEV-ENV"


deploy:
  stage: deploy
  tags:
  - stadler-dev-env
  only:
    - dev
  needs:
    - job: prepare-package
      artifacts: true
  script:
    - powershell.exe Stop-Service ${CI_PROJECT_NAME}
    - $DestinationPath = "D:\" + $env:CI_PROJECT_NAME
    - if((Test-Path -Path $DestinationPath)){Remove-Item $DestinationPath -Recurse -Force} # delete folder if exist (override)
    - if(-not (Test-Path -Path $DestinationPath)){New-Item -ItemType Directory -Path $DestinationPath} # make sure that a install folder exist
    - Copy-Item -Path ".\install\*" -Destination $DestinationPath -Recurse -Force
    - powershell.exe Start-Service ${CI_PROJECT_NAME}
    - Write-Host "Deployment complete!"
